<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vocab Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #0c0b0a;
    --paper: #ece5d8;
    --wall-ink: #2c2823;
    font-size: 16px;
  }
  html, body { margin: 0; height: 100%; background: #0c0b0a; overflow: hidden; }
  body { font-family: 'Karla', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #root, .vt-root { position: fixed; inset: 0; }
  button { font-family: inherit; }

  /* ---- wordmark ---- */
  .vt-wordmark {
    position: absolute; top: 22px; left: 26px; z-index: 30;
    font-family: 'Lora', serif; font-weight: 500; font-size: 15px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255,255,255,.62); pointer-events: none; mix-blend-mode: difference;
  }
  .dir-wall ~ .vt-wordmark, .vt-root:has(.dir-wall) .vt-wordmark { mix-blend-mode: normal; color: rgba(44,40,35,.5); }

  /* ---- direction shell ---- */
  .vt-dir { position: absolute; inset: 0; overflow: hidden; }
  .vt-art {
    position: absolute; inset: 0; background-position: center; background-repeat: no-repeat;
    background-size: cover; animation: vt-fade .9s ease both;
  }
  .vt-art-fallback { background: radial-gradient(120% 120% at 30% 20%, #2a2620, #121010 70%); }
  @keyframes vt-fade { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }

  .vt-scrim { position: absolute; inset: 0; pointer-events: none; }
  .scrim-bl {
    background:
      linear-gradient(to top, rgba(8,7,6,calc(var(--scrim,.62))) 0%, rgba(8,7,6,calc(var(--scrim,.62) * .55)) 26%, rgba(8,7,6,0) 58%),
      linear-gradient(to right, rgba(8,7,6,calc(var(--scrim,.62) * .85)) 0%, rgba(8,7,6,0) 55%);
  }
  .scrim-full {
    background:
      linear-gradient(to top, rgba(8,7,6,calc(var(--scrim,.62))) 0%, rgba(8,7,6,calc(var(--scrim,.62)*.25)) 45%, rgba(8,7,6,.15) 100%),
      radial-gradient(120% 90% at 50% 120%, rgba(8,7,6,.55), transparent 60%);
  }

  /* ---- content ---- */
  .vt-content { position: absolute; z-index: 20; color: #fff; }
  .vt-content-bl { left: 0; right: 0; bottom: 0; padding: clamp(28px, 5vw, 64px); max-width: 760px; }
  .vt-wordhead { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .vt-word {
    font-family: 'Lora', serif; font-weight: 500; margin: 0; line-height: 1.02;
    letter-spacing: -.015em; text-shadow: 0 2px 30px rgba(0,0,0,.35);
  }
  .vt-def {
    font-family: 'Karla', sans-serif; font-weight: 500; margin: 14px 0 0; line-height: 1.45;
    max-width: 44ch; color: rgba(255,255,255,.94); text-wrap: pretty;
  }
  .vt-example {
    font-family: 'Lora', serif; font-style: italic; font-weight: 400; margin: 12px 0 0;
    line-height: 1.5; max-width: 50ch; color: rgba(255,255,255,.78); text-wrap: pretty;
  }

  .vt-freq { display: inline-flex; gap: 5px; align-items: center; transform: translateY(-4px); }
  .vt-freq span { width: 7px; height: 7px; border-radius: 50%; display: block; transition: background .2s; }

  .vt-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(20px, 3vw, 30px); }

  .vt-corner-tr { position: absolute; top: 20px; right: 22px; z-index: 25; }

  /* ---- placard ---- */
  .vt-placard { text-align: right; }
  .vt-placard-trigger {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28);
    background: rgba(8,7,6,.32); color: #fff; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all .18s;
  }
  .vt-placard-trigger:hover { background: rgba(8,7,6,.5); border-color: rgba(255,255,255,.5); }
  .vt-placard-body {
    margin-top: 10px; text-align: left; width: 320px; max-width: 78vw;
    background: rgba(14,12,10,.74); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 16px 18px; color: #fff;
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: all .22s ease;
  }
  .vt-placard.open .vt-placard-body { opacity: 1; transform: none; pointer-events: auto; }
  .vt-placard-title { font-family: 'Lora', serif; font-style: italic; font-size: 17px; line-height: 1.25; }
  .vt-placard-artist { font-family: 'Karla', sans-serif; font-weight: 700; margin-top: 5px; font-size: 14px; }
  .vt-placard-meta { font-size: 12.5px; color: rgba(255,255,255,.6); margin-top: 3px; }
  .vt-placard-links { display: flex; flex-direction: column; gap: 7px; margin-top: 13px; }
  .vt-placard-links a {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
    text-decoration: none; width: fit-content;
  }
  .vt-placard-links a:hover { text-decoration: underline; }
  .vt-placard-links svg { width: 13px; height: 13px; }

  /* ---- direction B: museum wall ---- */
  .dir-wall {
    background:
      radial-gradient(120% 100% at 50% 0%, #f1ebe0, #e4dccd 70%, #d8cfbd 100%);
  }
  .vt-wall-grid {
    position: absolute; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr;
    align-items: center; gap: clamp(24px, 4vw, 60px); padding: clamp(40px, 6vw, 96px);
  }
  .vt-frame-col { display: flex; justify-content: center; align-items: center; height: 100%; }
  .vt-frame {
    margin: 0; position: relative; max-width: 100%; max-height: 78vh; aspect-ratio: 4 / 5;
    width: min(46vw, 560px); background: #fff; padding: clamp(14px, 1.6vw, 26px);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 30px 60px -28px rgba(40,33,24,.55), 0 8px 22px -16px rgba(0,0,0,.4);
  }
  .vt-frame::before {
    content: ""; position: absolute; inset: 9px; border: 1px solid rgba(0,0,0,.12); pointer-events: none; z-index: 5;
  }
  .vt-frame .vt-art { position: absolute; inset: clamp(14px,1.6vw,26px); animation: vt-fade .8s ease both; }
  .vt-label-col { color: var(--wall-ink); max-width: 480px; }
  .vt-label-rule { width: 42px; height: 3px; margin-bottom: 22px; border-radius: 2px; }
  .dir-wall .vt-word { color: var(--wall-ink); text-shadow: none; }
  .dir-wall .vt-def { color: rgba(44,40,35,.92); }
  .dir-wall .vt-example { color: rgba(44,40,35,.66); }
  .dir-wall .vt-freq span { box-shadow: 0 0 0 1px rgba(0,0,0,.04); }

  /* light control variant for the wall */
  .vt-controls.light button {
    color: var(--wall-ink) !important;
    background: rgba(255,255,255,.55) !important;
    border-color: rgba(44,40,35,.22) !important;
    backdrop-filter: none !important;
  }
  .vt-controls.light button:hover { background: #fff !important; border-color: rgba(44,40,35,.4) !important; }
  .vt-wall-placard { margin-top: 26px; }
  .dir-wall .vt-placard-trigger { background: rgba(255,255,255,.6); color: var(--wall-ink); border-color: rgba(44,40,35,.2); }
  .dir-wall .vt-placard-body { background: rgba(255,255,255,.92); color: var(--wall-ink); border-color: rgba(44,40,35,.12); }
  .dir-wall .vt-placard-meta { color: rgba(44,40,35,.55); }
  .dir-wall .vt-placard-title { color: var(--wall-ink); }
  .dir-wall .vt-wall-placard .vt-placard { text-align: left; }

  /* ---- direction C: immersive ---- */
  .vt-content-immersive { left: 0; right: 0; bottom: 0; padding: clamp(28px, 5vw, 72px); }
  .vt-immersive-eyebrow {
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .26em;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .vt-word-xl { line-height: .92; letter-spacing: -.03em; text-shadow: 0 4px 60px rgba(0,0,0,.4); }
  .vt-immersive-body { display: grid; grid-template-columns: auto 1fr; gap: 10px 26px; align-items: start; margin-top: 22px; max-width: 1000px; }
  .vt-immersive-body .vt-freq { grid-row: span 1; padding-top: 8px; }
  .vt-immersive-body .vt-def { grid-column: 2; margin: 0; }
  .vt-immersive-body .vt-example { grid-column: 2; }
  .vt-immersive-body .vt-controls { grid-column: 2; }

  /* ---- manage modal ---- */
  .vt-modal-scrim {
    position: fixed; inset: 0; z-index: 60; background: rgba(8,7,6,.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .vt-modal {
    width: min(620px, 100%); max-height: 86vh; display: flex; flex-direction: column;
    background: #faf7f1; color: #2a2723; border-radius: 18px; overflow: hidden;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.6);
    animation: vt-modal-in .24s ease;
  }
  @keyframes vt-modal-in { from { transform: translateY(14px); } to { transform: none; } }
  .vt-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 14px; }
  .vt-modal-head h2 { font-family: 'Lora', serif; font-weight: 600; font-size: 24px; margin: 0; }
  .vt-iconbtn { border: none; background: rgba(0,0,0,.05); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: #2a2723; }
  .vt-iconbtn:hover { background: rgba(0,0,0,.1); }
  .vt-upload {
    margin: 0 24px; display: flex; align-items: center; gap: 16px; cursor: pointer;
    padding: 18px; border: 1.5px dashed rgba(42,39,35,.3); border-radius: 14px; background: rgba(255,255,255,.5);
    color: #2a2723; transition: all .18s;
  }
  .vt-upload:hover { border-color: rgba(42,39,35,.55); background: #fff; }
  .vt-upload svg { width: 26px; height: 26px; flex: none; }
  .vt-upload strong { font-size: 15px; }
  .vt-upload p { margin: 3px 0 0; font-size: 12.5px; color: rgba(42,39,35,.6); }
  .vt-upload em { font-style: normal; font-weight: 700; color: rgba(42,39,35,.8); }
  .vt-msg { margin: 12px 24px 0; font-size: 13px; color: #6b5; font-weight: 600; }
  .vt-addbtn {
    margin: 12px 24px 0; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 8px 14px; border: 1px solid rgba(42,39,35,.3); border-radius: 999px;
    background: rgba(255,255,255,.5); color: #2a2723; font-size: 13.5px; font-weight: 600; transition: all .18s;
  }
  .vt-addbtn:hover { border-color: rgba(42,39,35,.55); background: #fff; }
  .vt-addbtn svg { width: 16px; height: 16px; flex: none; }
  .vt-addform { margin: 12px 24px 0; display: flex; flex-direction: column; gap: 10px; }
  .vt-addinput {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgba(42,39,35,.25);
    border-radius: 10px; background: #fff; color: #2a2723; font: inherit; font-size: 14px; resize: vertical;
  }
  .vt-addinput:focus { outline: none; border-color: rgba(42,39,35,.55); }
  .vt-addform-actions { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .vt-addform-actions .vt-textbtn { margin-left: 0; }
  .vt-addsave {
    background: #2a2723; color: #fff; border: none; cursor: pointer; padding: 9px 18px;
    border-radius: 999px; font-size: 13.5px; font-weight: 600; transition: opacity .18s;
  }
  .vt-addsave:hover { opacity: .85; }
  .vt-counts { display: flex; align-items: center; gap: 18px; padding: 16px 24px 12px; font-size: 14px; }
  .vt-counts strong { font-family: 'Lora', serif; font-size: 17px; }
  .vt-textbtn { margin-left: auto; background: none; border: none; cursor: pointer; color: #2a2723; text-decoration: underline; font-size: 13px; font-weight: 600; opacity: .7; }
  .vt-textbtn:hover { opacity: 1; }
  .vt-textbtn.light { color: #fff; margin: 14px 0 0; }
  .vt-wordlist { overflow-y: auto; padding: 0 24px 22px; }
  .vt-wordrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(42,39,35,.1); }
  .vt-wordrow.learned { opacity: .42; }
  .vt-wordrow-main { min-width: 0; }
  .vt-wordrow-word { font-family: 'Lora', serif; font-weight: 600; font-size: 16px; margin-right: 8px; }
  .vt-wordrow-def { font-size: 13px; color: rgba(42,39,35,.62); }
  .vt-wordrow-side { margin-left: auto; flex: none; }
  .vt-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 4px 9px; border-radius: 999px; background: rgba(42,39,35,.08); color: rgba(42,39,35,.6); }
  .vt-tag.freq { background: rgba(42,39,35,.06); }

  .vt-section-head { padding: 18px 24px 6px; }
  .vt-section-head h2 { font-family: 'Lora', serif; font-weight: 600; font-size: 24px; margin: 0; }

  .vt-sources { padding: 0 24px; }
  .vt-source-row { display: flex; align-items: center; gap: 10px;
    padding: 12px 0; cursor: pointer; font-size: 15px; border-top: 1px solid rgba(42,39,35,.1); }
  .vt-source-row:first-child { border-top: none; }
  .vt-source-row input { width: 16px; height: 16px; cursor: pointer; }
  .vt-source-row.locked { cursor: default; }
  .vt-source-hint { margin-left: auto; font-style: normal; font-size: 12px; opacity: .55; }

  /* ---- toast / loading / empty ---- */
  .vt-toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 70;
    background: rgba(14,12,10,.86); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.12); animation: vt-toast-in .25s ease both;
  }
  @keyframes vt-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .vt-loading {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #0c0b0a; color: rgba(255,255,255,.6); font-size: 14px; letter-spacing: .02em;
  }
  .vt-loading-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.5); animation: vt-pulse 1s ease-in-out infinite; }
  @keyframes vt-pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  .vt-empty {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; background: rgba(8,7,6,.4); backdrop-filter: blur(2px);
  }
  .vt-empty h2 { font-family: 'Lora', serif; font-weight: 500; font-size: 30px; margin: 0; }
  .vt-empty p { font-size: 15px; color: rgba(255,255,255,.7); margin: 10px 0 0; }

  @media (max-width: 820px) {
    .vt-wall-grid { grid-template-columns: 1fr; align-content: center; gap: 26px; }
    .vt-frame { width: min(70vw, 360px); max-height: 44vh; }
    .vt-corner-tr { top: 14px; right: 14px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>

  <script src="art-normalize.js"></script>
  <script src="art.js"></script>
  <script src="vocab.js"></script>
  <script src="ui.js"></script>
  <script src="directions.js"></script>
  <script src="app.js"></script>
</body>
</html>
